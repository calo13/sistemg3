# Ejemplo para Apache 2.4 + PHP-FPM. No instalado automáticamente.
# Sustituir dominio, ruta, socket y certificados antes de activarlo.
# Requiere ssl, rewrite, proxy y proxy_fcgi.

<VirtualHost *:80>
    ServerName memorylab.example
    Redirect permanent / https://memorylab.example/
</VirtualHost>

<VirtualHost *:443>
    ServerName memorylab.example
    DocumentRoot /var/www/memorylab/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/memorylab.example/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/memorylab.example/privkey.pem

    <Directory /var/www/memorylab/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        <FilesMatch "^index\.php$">
            SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
        </FilesMatch>

        <FilesMatch "^(?!index\.php$).*\.php$">
            Require all denied
        </FilesMatch>

        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/memorylab-error.log
    CustomLog ${APACHE_LOG_DIR}/memorylab-access.log combined
</VirtualHost>
