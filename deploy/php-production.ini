; Ejemplo de ajustes para combinar con el PHP-FPM del destino.
; No reemplaza el php.ini completo y no habilita extensiones.
; PHP CLI y PHP-FPM deben cumplir composer check-platform-reqs.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Los eventos del simulador se guardan en UTC y se presentan en Guatemala.
date.timezone = UTC

; Valores iniciales sujetos a recursos y límites del servidor real.
memory_limit = 256M
max_execution_time = 60
post_max_size = 16M
upload_max_filesize = 16M

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Las cookies HTTPS se configuran desde SESSION_SECURE_COOKIE en Laravel.
; No configurar credenciales de base, correo o usuarios en este archivo.
