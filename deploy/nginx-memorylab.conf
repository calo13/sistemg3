# Ejemplo para Nginx + PHP-FPM. No instalado automáticamente.
# Sustituir dominio, ruta, socket y certificados antes de activarlo.

server {
    listen 80;
    server_name memorylab.example;
    return 301 https://memorylab.example$request_uri;
}

server {
    listen 443 ssl;
    server_name memorylab.example;
    root /var/www/memorylab/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/memorylab.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memorylab.example/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    access_log /var/log/nginx/memorylab-access.log;
    error_log /var/log/nginx/memorylab-error.log;
}
